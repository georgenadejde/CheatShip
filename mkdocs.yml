site_name: "~/CheatShip"
site_description: "CheatShip — personal hacking cheat sheet"
site_url: https://georgenadejde.github.io/CheatShip
repo_url: https://github.com/georgenadejde/CheatShip
repo_name: georgenadejde/CheatShip

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: teal
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/georgenadejde
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/george-nadejde/
      name: LinkedIn

copyright: "George Nadejde · <a href='https://georgenadejde.github.io'>Portfolio</a>"

nav:
  - Home: index.md
  - Enumeration:
    - Nmap: enumeration/nmap.md
    - Gobuster: enumeration/gobuster.md
    - Passive Recon: enumeration/recon.md
  - Exploitation:
    - Shells: exploitation/shells.md
    - Web Attacks: exploitation/web.md
    - Passwords & Hashes: exploitation/passwords.md
    - Metasploit: exploitation/metasploit.md
  - Post-Exploitation:
    - Linux PrivEsc: post-exploitation/linux-privesc.md
    - Windows PrivEsc: post-exploitation/windows-privesc.md
    - Linux Commands: post-exploitation/linux.md
  - Reverse Engineering:
    - Frida: reverse-engineering/frida.md
  - Other:
    - Cryptography: other/crypto.md
    - Bandit Tricks: other/bandit.md
    - Resources: other/resources.md
